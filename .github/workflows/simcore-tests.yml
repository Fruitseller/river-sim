name: SimCore-Tests

# Headless-Verifikationsebene aus PLAN.md §5: die SimCore-Suite läuft bei jedem
# Push/PR, damit Kalibrierungs-Verschiebungen sofort auffallen.
#
# Bewusst NICHT Teil dieses Workflows: der Build der GDExtension (`scripts/build.sh`).
# Der GDExtension-Build braucht Godot/SwiftGodot und dauert ~3,5 min zusätzlich —
# das würde die CI-Laufzeit sprengen, ohne dass es zur eigentlichen Verifikation
# (headless XCTest, GPU-frei) etwas beiträgt.

on:
  push:
    branches: [main]
  pull_request:

# push (nur main) und pull_request können pro Push doppelt feuern (eigener Branch +
# PR-Merge-Ref). Die Gruppe bündelt alle Events eines PR (github.head_ref) bzw. eines
# main-Pushes (github.ref) und storniert den älteren Lauf.
concurrency:
  group: simcore-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least-Privilege: der Workflow liest nur den Checkout, braucht keine Schreibrechte.
permissions:
  contents: read

env:
  # Muss mit der lokal via Swiftly genutzten Toolchain-Version zusammenpassen
  # (SimCore/Package.swift verlangt tools-version 6.0 + Swift-5-Sprachmodus,
  # siehe AGENTS.md "Befehle").
  SWIFT_VERSION: "6.3.3"

jobs:
  test:
    # ubuntu-22.04 statt latest: die Swift.org-Toolchain (und swiftly) unterstützen
    # Ubuntu 24.04 noch nicht ("Unsupported platform: Ubuntu 24.04"), gemessen im
    # ersten CI-Lauf (Aug 2026). 22.04 hat auch libncursesw.so.6 für den Swift-Shim.
    runs-on: ubuntu-22.04
    steps:
      # Commit-SHA statt mutable Tag (Supply-Chain-Härtung, öffentliches Repo).
      # Versionsupdates laufen künftig über Dependabot (`.github/dependabot.yml`,
      # `github-actions`-Ecosystem), nicht über manuelles Nachziehen der Pins.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Toolchain-Cache: die heruntergeladene Swift-Toolchain ist mehrere GB groß;
      # ohne Cache würde jeder Lauf am Download hängen (Abnahmekriterium
      # "Laufzeit im Rahmen"). setup-swift installiert swiftly + Toolchain unter
      # ~/.local/share/swiftly und erkennt eine vorhandene Installation — deshalb
      # läuft der Schritt bei Cache-Hit UND -Miss durch, nur eben unterschiedlich
      # schnell.
      - name: Swiftly-Cache
        id: swiftly-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/share/swiftly
          key: swiftly-${{ runner.os }}-${{ env.SWIFT_VERSION }}

      - name: Swift-Toolchain einrichten
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      - name: Ncurses-Kompat-Shim (Debian/Ubuntu-Runner)
        # Die Swift.org-Toolchain erwartet libncurses.so.6; manche Ubuntu-Images
        # stellen nur die Wide-Char-Variante bereit. Gleiche Verknüpfung wie
        # scripts/build.sh. Schlägt der Shim still fehl, bricht der spätere
        # `swift`-Aufruf mit einer kryptischen "cannot open shared object file"-
        # Meldung ab — deshalb hier sichtbar loggen bzw. hart abbrechen, wenn
        # keine passende Lib zu finden ist.
        run: |
          COMPAT_LIBS="$PWD/.tools/swift-libs"
          if [[ -e "$COMPAT_LIBS/libncurses.so.6" ]]; then
            echo "Ncurses-Shim bereits vorhanden: $COMPAT_LIBS/libncurses.so.6"
          elif [[ -e /usr/lib/x86_64-linux-gnu/libncursesw.so.6 ]]; then
            mkdir -p "$COMPAT_LIBS"
            ln -s /usr/lib/x86_64-linux-gnu/libncursesw.so.6 "$COMPAT_LIBS/libncurses.so.6"
            echo "Ncurses-Shim angelegt: $COMPAT_LIBS/libncurses.so.6 -> libncursesw.so.6"
          else
            echo "::error::libncursesw.so.6 nicht gefunden — Swift-Toolchain kann libncurses.so.6 nicht laden. Runner-Image geändert?"
            exit 1
          fi
          echo "LD_LIBRARY_PATH=$COMPAT_LIBS:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      # SwiftPM-Build-Cache: verhindert, dass jeder Lauf komplett neu kompiliert.
      - name: SimCore-Build-Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: SimCore/.build
          key: simcore-build-${{ runner.os }}-${{ env.SWIFT_VERSION }}-${{ hashFiles('SimCore/Package.swift', 'SimCore/Sources/**', 'SimCore/Tests/**') }}
          restore-keys: |
            simcore-build-${{ runner.os }}-${{ env.SWIFT_VERSION }}-

      - name: SimCore-Suite ausführen
        run: |
          swift test -c release --package-path SimCore -Xswiftc -swift-version -Xswiftc 5
