name: CI

# Zwei Verifikationsebenen, zwei Jobs (Issue #52):
#
#   test            — der Sim-Kern (SimCore, headless XCTest, GPU-frei). PLAN.md §5.
#   godot-contract  — der Godot-Vertrag: GDExtension bauen, Projekt importieren,
#                     Build-Stempel-Parität, Smoke-/Geometrie-/Ribbon-Tests.
#
# Warum getrennt und NICHT `needs:`-verkettet: die beiden Jobs teilen keinen
# Build (SimCore/.build gegen Extension/.build — verschiedene Paketgraphen,
# verschiedene Scratch-Pfade) und laufen deshalb parallel. Die Gesamtzeit des
# Laufs ist damit die des langsameren Jobs, nicht die Summe. Messwerte und das
# vereinbarte Laufzeitlimit: docs/ci-measurements.md.
#
# Bis Issue #52 lief hier NUR der Sim-Kern; der Godot-Vertrag war eine
# Zusage im Review ("lokal ausgeführt"). Der Dateiname war entsprechend
# `simcore-tests.yml` — der Job heißt weiterhin `test`, damit vorhandene
# Verweise (Branch-Schutz, Badges) auf denselben Check zeigen.

on:
  push:
    branches: [main]
  pull_request:

# push (nur main) und pull_request können pro Push doppelt feuern (eigener Branch +
# PR-Merge-Ref). Die Gruppe bündelt alle Events eines PR (github.head_ref) bzw. eines
# main-Pushes (github.ref) und storniert den älteren Lauf.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least-Privilege: der Workflow liest nur den Checkout, braucht keine Schreibrechte.
permissions:
  contents: read

env:
  # Muss mit der lokal via Swiftly genutzten Toolchain-Version zusammenpassen
  # (SimCore/Package.swift verlangt tools-version 6.0 + Swift-5-Sprachmodus,
  # siehe AGENTS.md "Befehle").
  #
  # Version und Prüfsumme werden NUR ZUSAMMEN ausgetauscht — dasselbe Verfahren
  # wie bei der Godot-Binärdatei in scripts/fetch-godot.sh. Wie der Hash für eine
  # neue Version abgeleitet (und gegen die swift.org-Signatur verifiziert) wird,
  # steht in .github/actions/swift-toolchain/action.yml.
  SWIFT_VERSION: "6.3.3"
  # sha256 von swift-6.3.3-RELEASE-ubuntu22.04.tar.gz
  SWIFT_SHA256: "2c3ad7ad74ab7249d42f172ee3b40bc8a729893010b4a3384ba26f3c61e35008"

jobs:
  test:
    # ubuntu-22.04 statt latest: die Swift.org-22.04-Toolchain unterstützt Ubuntu
    # 24.04 nicht (glibc/System-Libs), und swiftly 0.3.0 scheiterte mit
    # "Unsupported platform: Ubuntu 24.04" (gemessen im ersten CI-Lauf, Aug 2026).
    # 22.04 hat auch libncursesw.so.6 für den Swift-Shim.
    runs-on: ubuntu-22.04
    # Die Pflichtsuite liegt lokal bei ~7 min, das vereinbarte Budget bei 15 min
    # (docs/ci-measurements.md). Der Deckel fängt den Hänger ab, nicht das
    # langsame Wachstum — sonst verbrennt ein Endlos-Test sechs Stunden
    # Runner-Zeit.
    timeout-minutes: 40
    steps:
      # Commit-SHA statt mutable Tag (Supply-Chain-Härtung, öffentliches Repo).
      # Versionsupdates laufen künftig über Dependabot (`.github/dependabot.yml`,
      # `github-actions`-Ecosystem), nicht über manuelles Nachziehen der Pins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/swift-toolchain
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
          swift-sha256: ${{ env.SWIFT_SHA256 }}

      # SwiftPM-Build-Cache: verhindert, dass jeder Lauf komplett neu kompiliert.
      - name: SimCore-Build-Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: SimCore/.build
          key: simcore-build-${{ runner.os }}-${{ env.SWIFT_VERSION }}-${{ hashFiles('SimCore/Package.swift', 'SimCore/Sources/**', 'SimCore/Tests/**') }}
          restore-keys: |
            simcore-build-${{ runner.os }}-${{ env.SWIFT_VERSION }}-

      # RS_MEASURE bleibt UNGESETZT: die Mess-/Sweep-Läufe (Namensendung
      # `Diagnostic`) drucken nur Tabellen für docs/ und können nicht rot werden,
      # kosten aber den Großteil der Laufzeit. Siehe
      # SimCore/Tests/SimCoreTests/MeasurementGate.swift.
      - name: SimCore-Suite ausführen
        run: |
          swift test -c release --package-path SimCore -Xswiftc -swift-version -Xswiftc 5

  godot-contract:
    # Der Godot-Vertrag: alles, was die GDExtension Godot zusagt. Lief bis
    # Issue #52 nur lokal — und damit genau dann nicht, wenn es darauf ankam.
    runs-on: ubuntu-22.04
    # Kaltbau der Extension auf einem 4-Kern-Linux-Runner: ~27 min (AGENTS.md,
    # SwiftGodots Codegen dominiert). Mit warmem Cache Minuten. Der Deckel lässt
    # einen Kaltbau plus Godot-Läufe zu, ohne einen Hänger auszusitzen.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/swift-toolchain
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
          swift-sha256: ${{ env.SWIFT_SHA256 }}

      # Der teure Teil: SwiftGodots Codegen speist die ganze Modulkette. Der Key
      # hängt an Package.resolved (der Pin aus Issue #49) und an den Quellen; der
      # restore-key holt sonst den letzten Stand desselben Toolchain-Stands, aus
      # dem SwiftPM inkrementell weiterbaut.
      - name: Extension-Build-Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Extension/.build
          key: extension-build-${{ runner.os }}-${{ env.SWIFT_VERSION }}-${{ hashFiles('Extension/Package.resolved', 'Extension/Sources/**', 'SimCore/Sources/**') }}
          restore-keys: |
            extension-build-${{ runner.os }}-${{ env.SWIFT_VERSION }}-

      # Godot-Binärdatei: Version und Prüfsumme stehen in scripts/fetch-godot.sh,
      # damit CI und Arbeitsplatz dieselbe Binärdatei benutzen. Die Version steht
      # deshalb auch hier NICHT im Klartext — `--path` liest sie aus dem Skript.
      - name: Godot-Version auflösen
        id: godot
        run: |
          BIN="$(scripts/fetch-godot.sh --path)"
          echo "dir=$(dirname "$BIN")" >> "$GITHUB_OUTPUT"
          echo "tag=$(basename "$(dirname "$BIN")")" >> "$GITHUB_OUTPUT"

      - name: Godot-Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.godot.outputs.dir }}
          key: ${{ steps.godot.outputs.tag }}-linux-x86_64

      # Der Cache-Hit ist hier der Normalfall — es wird also meistens NICHTS
      # heruntergeladen. Deshalb prüft fetch-godot.sh die Binärdatei auch dann
      # gegen ihre gepinnte sha256 (~0,1 s): der Cache-Key hängt nur am
      # Versions-Tag, ein veralteter oder untergeschobener Eintrag ließe die
      # Vertragstests sonst still gegen eine fremde Binärdatei laufen.
      - name: Godot bereitstellen (inkl. Prüfsumme des Cache-Stands)
        run: echo "GODOT=$(scripts/fetch-godot.sh)" >> "$GITHUB_ENV"

      # build.sh baut die GDExtension und kopiert sie samt Swift-Runtime nach
      # game/bin/. Es brennt dabei den Build-Stempel des Quellstands ein und
      # prüft am Ende selbst, dass er in der KOPIERTEN Library ankommt.
      - name: GDExtension bauen (release)
        run: |
          "$(git rev-parse --show-toplevel)"/scripts/build.sh release

      # ======================= TEMPORÄR: Diagnose Issue #61 =======================
      # Der Import crasht NUR auf dem Runner (lokal auf Debian 13 läuft er), und
      # zwar erst NACHDEM alle Import-Phasen "DONE" gemeldet haben — also beim
      # Herunterfahren. Diese Schritte sammeln in EINER CI-Runde alles, was die
      # Stelle benennen kann; sie fliegen wieder raus, sobald die Ursache steht.
      - name: Diagnose — Ladepfad und Bibliotheken
        continue-on-error: true
        run: |
          set -x
          uname -a
          ldd --version | head -n1
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
          ls -la game/bin
          ldd game/bin/libRiverSimGD.so || true
          ldd game/bin/libSwiftGodot.so || true
          ldd "$GODOT" || true

      # Vier Import-Läufe, jeder aus demselben Ausgangszustand (game/.godot weg =
      # Erst-Import wie im roten Lauf), jeder mit protokolliertem Exit-Code:
      #   A: unverändert — die Referenz.
      #   B: ohne die GDExtension — trennt "Godot allein" von "Godot + Extension".
      #      (Die Gegenprobe aus Runde 1 lief gegen ein LEERES game/bin/ und war
      #      damit wertlos; hier ist die Extension gebaut und wird nur beiseite
      #      gelegt.)
      #   C: ohne den Backtracer der Swift-Runtime — die installiert auf Linux
      #      eigene Signal-Handler und rauft sich potenziell mit Godots
      #      Crash-Handler.
      #   D: ohne den ncurses-Shim im LD_LIBRARY_PATH (den setzt die
      #      Toolchain-Action global; Godot erbt ihn).
      - name: Diagnose — Import-Varianten (Exit-Codes)
        continue-on-error: true
        run: |
          run_import() {
            local label="$1"; shift
            rm -rf game/.godot
            set +e
            env "$@" "$GODOT" --headless --path game --import >"/tmp/import-$label.log" 2>&1
            local rc=$?
            set -e
            echo "=== $label: exit=$rc ==="
            tail -n 25 "/tmp/import-$label.log"
            echo "--- extension_list.cfg nach $label ---"
            cat game/.godot/extension_list.cfg 2>&1 || true
          }
          run_import A
          mkdir -p /tmp/bin-stash && mv game/bin/*.so /tmp/bin-stash/
          run_import B
          mv /tmp/bin-stash/*.so game/bin/
          run_import C SWIFT_BACKTRACE=enable=no
          run_import D LD_LIBRARY_PATH=

      - name: Diagnose — Import unter gdb (Backtrace)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb
          rm -rf game/.godot
          gdb -batch -nx \
            -ex "set confirm off" \
            -ex "set pagination off" \
            -ex run \
            -ex "info program" \
            -ex "thread apply all bt" \
            --args "$GODOT" --headless --path game --import

      # Crasht auch das SPÄTERE Laden der Extension (Skript-Lauf), oder nur der
      # Erst-Import? Der rote Lauf kam nie so weit.
      - name: Diagnose — zweiter Import und Smoke-Test (Exit-Codes)
        continue-on-error: true
        run: |
          set +e
          "$GODOT" --headless --path game --import >/tmp/import-2.log 2>&1
          echo "=== zweiter Import: exit=$? ==="
          tail -n 25 /tmp/import-2.log
          "$GODOT" --headless --path game --script res://tests/smoke.gd >/tmp/smoke.log 2>&1
          echo "=== smoke.gd: exit=$? ==="
          tail -n 40 /tmp/smoke.log
      # ===================== ENDE TEMPORÄR: Diagnose Issue #61 =====================

      # Godot lädt GDExtensions ausschließlich aus .godot/extension_list.cfg, und
      # die entsteht erst beim Import. game/.godot/ ist gitignoriert, fehlt also
      # in jedem frischen Checkout — ohne diesen Schritt bliebe SimNode
      # unregistriert, obwohl game/bin/ korrekt gefüllt ist.
      #
      # TEMPORÄR `continue-on-error`, solange Issue #61 offen ist: so laufen die
      # Vertragsschritte danach trotzdem und zeigen, wie weit es überhaupt trägt.
      - name: Godot-Projekt importieren
        continue-on-error: true
        run: |
          "$GODOT" --headless --path game --import

      # Parität der beiden Stempel-Verfahren (Shell in scripts/build-stamp.sh,
      # GDScript in game/scripts/BuildStamp.gd). AGENTS.md verlangt Bytegleichheit;
      # bis Issue #52 war das eine Review-Zusage. Läuft NACH dem Bau, damit die
      # generierte BuildStamp.swift existiert und die Ausnahme mitgeprüft wird.
      - name: Build-Stempel-Parität (Shell ↔ GDScript)
        run: |
          "$GODOT" --headless --path game --script res://tests/build_stamp_parity.gd

      # Die drei Godot-Vertragstests. Getrennte Schritte statt einer Schleife:
      # so zeigt die GitHub-Oberfläche direkt, WELCHER Vertrag gebrochen ist.
      - name: Smoke-Test (SimNode-Registrierung, Felder, step, Sculpting)
        run: |
          "$GODOT" --headless --path game --script res://tests/smoke.gd

      - name: Wasser-Geometrie (Issue #34)
        run: |
          "$GODOT" --headless --path game --script res://tests/water_geometry.gd

      - name: Fluss-Ribbons (Issue #31)
        run: |
          "$GODOT" --headless --path game --script res://tests/river_ribbons.gd
